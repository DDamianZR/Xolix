server {
    listen 80;
    server_name localhost;

    # Bloque para archivos de React (Single Page Application)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirigir cualquier ruta no encontrada a index.html (React Router)
        try_files $uri $uri/ /index.html;
    }

    # Bloque de Reverse Proxy para el Backend (API)
    location /api/ {
        # 'backend' es el nombre del servicio en el docker-compose.yml
        proxy_pass http://backend:8000/api/;
        
        # Mantener los headers originales de la solicitud
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
