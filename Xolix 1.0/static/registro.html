<!DOCTYPE html>
<html>
<head>
    <title>Registro de Personal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h2>Registro de Personal</h2>

    <form id="registroForm">
        <input type="text" id="nombre" placeholder="Nombre completo" required>
        <input type="email" id="correo" placeholder="Correo" required>
        <input type="text" id="rfc" placeholder="RFC" required>
        <input type="text" id="curp" placeholder="CURP" required>
        <input type="number" id="edad" placeholder="Edad" required>
        <input type="text" id="direccion" placeholder="Dirección" required>

        <select id="sexo">
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
        </select>

        <select id="tipo_personal">
            <option value="empleado">Empleado</option>
            <option value="voluntario">Voluntario</option>
        </select>

        <input type="text" id="rol" placeholder="Rol" required>
        <input type="password" id="password" placeholder="Contraseña" required>

        <button type="submit">Registrar</button>



        
    </form>

    <!-- 🔥 CONTENEDOR DE MENSAJES -->
    <div id="mensaje" style="margin-top:15px; font-weight:bold;"></div>

    <script src="/static/script.js"></script>


    <div class="nav-switch">
    <a href="/login">¿Ya tienes cuenta? Iniciar sesión</a>
</div>

</body>
</html>
