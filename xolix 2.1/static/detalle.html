<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Xolix | Detalle de usuario</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg">

<div class="neo-card full">
    <h2 class="logo">XOLIX</h2>
    <p class="subtitle" id="subtitulo">Cargando usuario...</p>

    <div id="contenido" style="display:none;">
        <div class="detail-grid" id="detalles"></div>

        <div class="btn-row" style="margin-top:20px;">
            <button class="secondary" onclick="window.location.href='/dashboard'">← Volver</button>
            <button class="primary" id="btnEditar" style="display:none;" onclick="irEditar()">Editar</button>
        </div>
    </div>

    <div id="error" style="display:none; color:#E57373; margin-top:20px;">
        Usuario no encontrado.
    </div>
</div>

<script src="/static/detalle.js"></script>
</body>
